# 仅这些原始 S7 地址可由 s7_write 写入。地址和名称来自
# edge-gateway/config/tags_s7.json；未映射地址一律拒绝。
# M1.2 仅标为“急停状态”而未定义极性，不能映射为 SafetyOK 或
# EmergencyStopOff。因此下列控制项在安全位无法独立确认时仍会 fail-closed。
s7_write_addresses:
  "M0.1":
    target: "DB1.MOTOR_RUN"
    type: "bool"
  "MW14":
    target: "DB1.MotorSpeed"
    type: "int16"

write_rules:
  - target: "DB1.MOTOR_RUN"
    require_bits: ["DB1.SafetyOK", "DB1.EmergencyStopOff"]

  - target: "DB1.MotorSpeed"
    max_value: 3000
    min_value: 0
    require_bits: ["DB1.SafetyOK", "DB1.EmergencyStopOff"]
    shadow_test: true

  - target: "DB1.HeaterPower"
    max_value: 100
    min_value: 0
    require_bits: ["DB1.TemperatureSensorOK"]
    cooldown_seconds: 5

  - target: "DB1.ConveyorSpeed"
    max_value: 1500
    min_value: 0
    require_bits: ["DB1.SafetyOK"]

  - target: "DB1.PumpSpeed"
    max_value: 2000
    min_value: 0
    require_bits: ["DB1.SafetyOK", "DB1.PumpPressureOK"]
    cooldown_seconds: 3

  - target: "DB1.ValvePosition"
    max_value: 100
    min_value: 0
    require_bits: ["DB1.SafetyOK"]

  - target: "DB1.RobotSpeed"
    max_value: 500
    min_value: 0
    require_bits: ["DB1.SafetyOK", "DB1.EmergencyStopOff", "DB1.RobotZoneClear"]
    cooldown_seconds: 2

  - target: "DB1.PressForce"
    max_value: 5000
    min_value: 0
    require_bits: ["DB1.SafetyOK", "DB1.EmergencyStopOff", "DB1.PressGuardClosed"]
    cooldown_seconds: 10

  - target: "DB1.GripperPressure"
    max_value: 100
    min_value: 0
    require_bits: ["DB1.SafetyOK", "DB1.EmergencyStopOff"]
    cooldown_seconds: 1
    description: "机器人夹爪压力控制（0-100 bar）"

  - target: "DB1.JointAngle"
    max_value: 180
    min_value: -180
    require_bits: ["DB1.SafetyOK", "DB1.RobotZoneClear"]
    cooldown_seconds: 3
    description: "机器人关节角度限制（±180°）"

  - target: "DB1.RobotConveyorSpeed"
    max_value: 2000
    min_value: 0
    require_bits: ["DB1.SafetyOK", "DB1.EmergencyStopOff"]
    cooldown_seconds: 2
    description: "机器人传送带速度控制（0-2000 rpm）"
