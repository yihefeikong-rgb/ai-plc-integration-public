services:
  # 时序数据库
  influxdb:
    image: influxdb:2.7
    container_name: ai-plc-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=ai-plc
      - DOCKER_INFLUXDB_INIT_BUCKET=plc-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - plc-network

  # OpenPLC 仿真
  openplc:
    image: fdamador/openplc
    container_name: ai-plc-openplc
    ports:
      - "8080:8080"
      - "502:502"
    volumes:
      - ./plc-programs:/openplc/scripts
    networks:
      - plc-network
    profiles:
      - simulation

  # 边缘网关（DeepSeek 云端 AI）
  edge-gateway:
    build: ./edge-gateway
    container_name: ai-plc-gateway
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=dev-token
      - INFLUXDB_ORG=ai-plc
      - INFLUXDB_BUCKET=plc-data
      - MODBUS_HOST=openplc
      - MODBUS_PORT=502
    volumes:
      - ./mcp-servers:/app/mcp-servers
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - influxdb
    networks:
      - plc-network

volumes:
  influxdb-data:

networks:
  plc-network:
    driver: bridge
