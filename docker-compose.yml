services:
  # 时序数据库
  influxdb:
    image: influxdb:2.7
    container_name: ai-plc-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:?请设置 INFLUXDB_PASSWORD 环境变量}
      - DOCKER_INFLUXDB_INIT_ORG=ai-plc
      - DOCKER_INFLUXDB_INIT_BUCKET=plc-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:?请设置 INFLUXDB_TOKEN 环境变量}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - plc-network

  # OpenPLC 仿真
  openplc:
    image: fdamador/openplc
    container_name: ai-plc-openplc
    ports:
      - "8080:8080"
      - "502:502"
    volumes:
      - ./plc-programs:/openplc/scripts
    networks:
      - plc-network
    profiles:
      - simulation

  # 边缘网关（DeepSeek 云端 AI）
  edge-gateway:
    build: ./edge-gateway
    container_name: ai-plc-gateway
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?请设置 INFLUXDB_TOKEN 环境变量}
      - INFLUXDB_ORG=ai-plc
      - INFLUXDB_BUCKET=plc-data
      - MODBUS_HOST=openplc
      - MODBUS_PORT=502
    volumes:
      - ./mcp-servers:/app/mcp-servers:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs
    depends_on:
      - influxdb
    networks:
      - plc-network

volumes:
  influxdb-data:

  # Grafana 仪表盘
  grafana:
    image: grafana/grafana:latest
    container_name: ai-plc-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${INFLUXDB_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - plc-network
    profiles:
      - monitoring

volumes:
  influxdb-data:
  grafana-data:

networks:
  plc-network:
    driver: bridge
