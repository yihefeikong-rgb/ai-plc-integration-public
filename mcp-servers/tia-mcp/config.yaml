# ═══════════════════════════════════════════════════
# AI-PLC 项目统一配置
# ═══════════════════════════════════════════════════
# 支持环境变量引用: ${VAR_NAME} 或 ${VAR_NAME:默认值}
# 相对路径从项目根目录（本文件的上上级目录的上级目录）解析

# ── TIA Portal ──
tia:
  version: "V21"  # TIA Portal V21
  # TIA 项目文件 (.ap21)
  project_path: "${TIA_PROJECT_PATH:D:\\PLC cheng xu\\TIA PLC CHENG XU\\demo_V21\\demo_V21.ap21}"
  # TIA Portal 安装目录（Openness API DLL 所在）
  install_dir: "${TIA_INSTALL_DIR:D:\\TIA BEN TI\\Portal V21}"
  # 仿真/输出文件目录（XML、SVG、SCL 均输出到此）
  output_dir: "${TIA_OUTPUT_DIR:D:\\TIA FANG ZHEN}"

# ── CartGen LAD 生成器 ──
cartgen:
  # CartGen.dll 相对路径（从项目根目录算）
  dll_path: "mcp-servers/tia-mcp/CartGen/bin/Release/net8.0/CartGen.dll"

# ── DeepSeek AI ──
deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  api_url: "https://api.deepseek.com/v1/chat/completions"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 4000
  timeout_sec: 60

# ── 模板 & 代码生成 ──
generation:
  templates_dir: "mcp-servers/tia-mcp/templates"
  scl_templates_dir: "plc-code-templates/siemens-scl"
  # 批量生成时跳过的模板（已验证通过的无需重复生成）
  batch_skip:
    - "电机正反转"

# ── 日志 ──
logging:
  audit_log: "mcp-servers/tia-mcp/logs/audit.log"
  batch_log: "mcp-servers/tia-mcp/logs/batch_gen.log"

# ── 仿真 ──
simulation:
  # 后端: "v18" (免费版) 或 "advanced" (S7-PLCSIM Advanced, 支持 Factory I/O)
  backend: "${PLCSIM_BACKEND:advanced}"

  # PLCSIM Advanced V5.0 安装路径
  advanced_install_dir: "${PLCSIM_ADV_DIR:D:\\TIA FANG ZHEN\\PLCSIMADV}"

  # PLCSIM Advanced 连接参数（仅 backend=advanced 时生效）
  advanced:
    plc_ip: "192.168.0.1"
    rack: 0
    slot: 1
    port: 102

  # 黄金备份（PLCSIM 实例存档）
  golden_backup:
    # V21（高版本优先）
    v21_dir: "${TIA_PROJECT_PATH:D:\\PLC cheng xu\\TIA PLC CHENG XU\\demo_V21}"
    # V18（回退）
    v18_dir: "${TIA_PROJECT_PATH:D:\\PLC cheng xu\\TIA PLC CHENG XU\\demo}"
    # golden zip 文件路径（使用 v21_dir 的父目录推导，走 env resolve）
    zip_path: "${V21_DIR:D:\\PLC cheng xu\\TIA PLC CHENG XU\\demo_V21}/factory_io1_golden.zip"
    # PLCSIM 实例存储目录
    storage_path: "${V21_DIR:D:\\PLC cheng xu\\TIA PLC CHENG XU\\demo_V21}/plcsim_storage"

# ── Factory I/O ──
factory_io:
  # Factory I/O 安装路径
  install_dir: "${FACTORY_IO_DIR:D:\\Factory IO}"
  # Factory I/O 可执行文件路径
  exe_path: "${FACTORY_IO_DIR:D:\\Factory IO}\\Factory IO.exe"
  # 场景文件路径
  scene_path: "${FIO_SCENE_PATH:C:\\Users\\huangxinyang\\Documents\\Factory IO\\My Scenes\\测试.factoryio}"
  # 导出的 CSV I/O 映射文件
  csv_output: "D:\\TIA FANG ZHEN\\factory_io_mapping.csv"

  # ═══════════════════════════════════════════════════
  # Factory I/O ↔ PLCSIM Advanced 连接配置
  # ═══════════════════════════════════════════════════

  # 驱动模式: "plcsim" (Softbus, 推荐) 或 "tcpip" (S7-1200/1500 Ethernet)
  driver_mode: "${FIO_DRIVER_MODE:plcsim}"

  # PLCSIM Advanced 实例名（仅 drivermode=plcsim 时生效）
  # Factory I/O 要求固定为 "factoryio"
  plcsim_instance: "factoryio"

  # IO 偏移量（两种模式通用）
  # 传感器 → %I{input_offset}.0 开始
  # 执行器 → %Q{output_offset}.0 开始
  io_offset_input: 10
  io_offset_output: 10

  # TCP/IP 模式连接参数（仅 drivermode=tcpip 时生效）
  tcpip:
    host: "${FIO_TCP_HOST:192.168.0.1}"
    rack: 0
    slot: 1
    model: "S7-1500"

# ── 安全 ──
safety:
  emergency_stop: "iStop"
  overload: "iOverload"
  interlock_rules: "safety/interlock-rules.yml"
