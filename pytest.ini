[pytest]
addopts = -m "not integration and not hardware and not desktop and not network"
testpaths = tests/offline orchestrator/tests
python_files = test_*.py
markers =
    integration: tests that require real hardware (PLCSIM, PLC, etc.)
    unit: unit tests (no external dependencies)
    s7: S7 protocol tests
    slow: slow running tests
    hardware: tests that may touch PLC, PLCSIM, TIA, Factory I/O, or device interfaces
    desktop: tests that may start or automate Windows desktop applications
    network: tests that may open a network connection
